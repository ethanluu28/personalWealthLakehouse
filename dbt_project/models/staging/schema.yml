version: 2

models:
  - name: stg_trades
    columns:
      - name: trade_date
        tests: [not_null]
      - name: account
        tests: [not_null]
      - name: action
        tests: [not_null]
      - name: symbol
        tests: [not_null]
      - name: amount
        tests: [not_null]
      - name: source
        tests:
          - not_null
          - accepted_values:
              values: ['fidelity', 'vanguard']
      - name: row_hash
        tests: [not_null, unique]

  - name: stg_transactions
    columns:
      - name: transaction_date
        tests: [not_null]
      - name: description
        tests: [not_null]
      - name: amount
        tests: [not_null]
      - name: source
        tests:
          - not_null
          - accepted_values:
              values: ['amex', 'chase']
      - name: row_hash
        tests: [not_null, unique]

  - name: stg_stock_prices
    columns:
      - name: price_date
        tests: [not_null]
      - name: symbol
        tests: [not_null]
      - name: close
        tests: [not_null]
      - name: row_hash
        tests: [not_null, unique]